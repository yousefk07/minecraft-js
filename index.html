<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minecraft</title>
<link rel="stylesheet" href="css/style.css">
<style>
  /* Fallback styles so the game is playable even if css/style.css is missing */
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    width: 100%;
    height: 100%;
    background: #000;
  }
  canvas { display: block; }

  #blocker {
    position: fixed;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.7);
    z-index: 100;
    cursor: pointer;
    font-family: monospace;
    color: #ffffff;
    text-align: center;
    user-select: none;
  }
  #blocker.hidden { display: none; }

  #blocker h1 {
    font-family: monospace;
    font-size: 48px;
    color: #ffffff;
    text-shadow: 2px 2px #3f3f3f;
    margin: 0 0 24px 0;
    letter-spacing: 2px;
  }

  #blocker .instructions {
    font-family: monospace;
    font-size: 16px;
    line-height: 1.9;
    color: #ffffff;
    text-shadow: 2px 2px #3f3f3f;
  }

  #blocker .instructions .key {
    color: #ffff55;
    font-weight: bold;
  }

  #blocker .click-to-play {
    font-family: monospace;
    font-size: 22px;
    color: #ffffff;
    text-shadow: 2px 2px #3f3f3f;
    margin-top: 28px;
    animation: blink 1.2s steps(2, start) infinite;
  }

  @keyframes blink {
    to { visibility: hidden; }
  }
</style>
</head>
<body>

<div id="blocker">
  <h1>Minecraft</h1>
  <div class="instructions">
    <div><span class="key">WASD</span> &mdash; Move</div>
    <div><span class="key">Space</span> &mdash; Jump</div>
    <div><span class="key">Mouse</span> &mdash; Look around</div>
    <div><span class="key">Left-click</span> &mdash; Break block</div>
    <div><span class="key">Right-click</span> &mdash; Place block</div>
    <div><span class="key">1-9</span> &mdash; Select block</div>
    <div><span class="key">Shift</span> &mdash; Sprint</div>
    <div><span class="key">Esc</span> &mdash; Pause</div>
  </div>
  <div class="click-to-play">Click to Play</div>
</div>

<!-- three.js r128, pinned with a Subresource Integrity hash so a tampered CDN
     copy is refused by the browser instead of running in this page. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"
        integrity="sha512-dLxUelApnYxpLt6K2iomGngnHO83iUvZytA3YjDUCjT0HDOHKXnVYdf3hU4JjM8uEhxf9nD1/ey98U3t2vZ0qQ=="
        crossorigin="anonymous"
        referrerpolicy="no-referrer"></script>
<script src="js/engine.js"></script>
<script src="js/world.js"></script>
<script src="js/player.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
